spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/refnet}
    username: ${DATABASE_USERNAME:refnet}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:10MB}
server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt-secret: ${JWT_SECRET:}
